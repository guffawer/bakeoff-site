<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100E0C">
<link rel="icon" href="assets/block.webp">
<title>Snatch Block: Look A</title>
<link rel="stylesheet" href="../shared/look.css">
</head>
<body class="look" data-look="a">
<main class="stage">
<canvas></canvas>
<section class="panel gauge ui">
<div class="row"><h1>SNATCH BLOCK</h1><div class="load"><span data-load>0.0</span> <small>/ 12 t</small></div></div>
<div class="bar"><i></i><b></b></div>
<div class="row"><span>Advantage 2:1</span><span class="state">TAKING UP</span></div>
</section>
<output class="panel fps ui">-- fps</output>
<div class="rig ui" aria-label="Control design, not active in the look test"><button type="button"><span>2:1</span>Block</button><button type="button"><span>&minus;</span>Slack</button><button type="button" class="go"><span>+</span>Winch</button></div>
<div class="panel dock ui">
<p>Look A: Forest Clearing (design test, buttons above are not active)</p>
<nav class="tools"><button type="button" data-sound>Sound</button><button type="button" data-clip>Clip Mode</button><a href="../b/">Look B</a><a href="../">Info</a></nav>
</div>
</main>
<script src="../shared/look.js"></script>
</body>
</html>
